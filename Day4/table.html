<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4fb;
      font-family: system-ui, Arial, sans-serif;
    }

    table {
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 6px 24px #3b3b8f26;
    }

    th, td {
      padding: 16px 26px;
      text-align: center;
      border: 1px solid #dfe1f3;
    }

    th { background: #4338ca; color: #fff; }

    /* Cells that stretch across rows or columns get a soft tint */
    td[rowspan], td[colspan] { background: #eef0ff; font-weight: 600; }
  </style>
</head>
<body>
  <table>
    <tr>
      <th>Header</th><th>Header</th><th>Header</th><th>Header</th>
    </tr>

    <tr>
      <td rowspan="3">Span row</td>   <!-- covers this row and the 2 below -->
      <td colspan="2">Span columns</td>
      <td>Cell</td>
    </tr>

    <tr>
      <td rowspan="2">Span rows</td>
      <td>Cell</td>
      <td rowspan="2">Span both</td>
    </tr>

    <tr>
      <td>Cell</td>
    </tr>
  </table>
</body>
</html>
