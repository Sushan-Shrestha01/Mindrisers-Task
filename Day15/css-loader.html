<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Loader</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-wrap: wrap;
      gap: 80px;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #fff;
      font-family: system-ui, Arial, sans-serif;
    }

    .item { text-align: center; }
    .item p { margin-top: 24px; color: #9aa; }

    
    .ring {
      width: 50px; height: 50px;
      margin: auto;
      border: 6px solid #333;
      border-top-color: #4cc9f0;    
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    
    .bars { display: flex; gap: 6px; height: 50px; align-items: center; justify-content: center; }
    .bars span { width: 8px; height: 20px; background: #f72585; animation: stretch 1s ease-in-out infinite; }

   
    .dots { display: flex; gap: 8px; height: 50px; align-items: center; justify-content: center; }
    .dots span { width: 14px; height: 14px; border-radius: 50%; background: #ffd166; animation: pulse 1s ease-in-out infinite; }

   
    .bars span:nth-child(2) { animation-delay: .15s; }
    .bars span:nth-child(3) { animation-delay: .30s; }
    .bars span:nth-child(4) { animation-delay: .45s; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }

    
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes stretch { 50% { height: 50px; } }
    @keyframes pulse   { 50% { transform: scale(1.8); opacity: .4; } }
  </style>
</head>
<body>

  <div class="item">
    <div class="ring"></div>
    <p>Loader #1</p>
  </div>

  <div class="item">
    <div class="bars"><span></span><span></span><span></span><span></span></div>
    <p>Loader #2</p>
  </div>

  <div class="item">
    <div class="dots"><span></span><span></span><span></span></div>
    <p>Loader #3</p>
  </div>

</body>
</html>
